# Copy local dev server alongside the Lambda handler so it is available
# when the container is started with the docker-compose override command.
services:
  webhook:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Required – your Shopwired REST API key.
      SHOPWIRED_API_KEY: "${SHOPWIRED_API_KEY:?Set SHOPWIRED_API_KEY in .env or the environment}"
      # Optional – enables X-ShopWired-Signature verification and the initial
      # webhook verification handshake.  Strongly recommended in production.
      SHOPWIRED_WEBHOOK_SECRET: "${SHOPWIRED_WEBHOOK_SECRET:-}"
      PORT: "8080"
    # Override the default Lambda RIE entrypoint with the local HTTP server so
    # that ngrok (or curl) can POST raw webhook payloads to port 8080.
    command: python3 local_server.py
    volumes:
      # Mount source files so code changes are reflected without rebuilding.
      - ./lambda_function.py:/var/task/lambda_function.py:ro
      - ./shopwired_client.py:/var/task/shopwired_client.py:ro
      - ./local_server.py:/var/task/local_server.py:ro
